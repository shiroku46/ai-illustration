<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Illustration Candidate Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <p class="eyebrow">LOCAL REVIEW</p>
    <h1>漫才キャラクター候補比較</h1>
    <p>最大4候補を比較し、品質段階を明示したレビューJSONをブラウザ内で作成します。サーバー側への書き込みは行いません。</p>
  </header>
  <main>
    <section class="panel filters" aria-label="filters">
      <label>キャラクター <select id="character-filter"><option value="">すべて</option></select></label>
      <label>役割 <select id="role-filter"><option value="">すべて</option><option value="boke">ボケ</option><option value="tsukkomi">ツッコミ</option></select></label>
      <label>表情 <select id="expression-filter"><option value="">すべて</option></select></label>
      <label>ポーズ <select id="pose-filter"><option value="">すべて</option></select></label>
      <label>レビュー <select id="review-filter"><option value="">すべて</option></select></label>
      <button id="clear-selection" type="button">比較選択を解除</button>
    </section>
    <p id="status" role="status">候補を読み込んでいます…</p>
    <section id="candidate-list" class="candidate-list" aria-label="candidate list"></section>
    <section class="panel comparison">
      <h2>比較ボード <span id="selected-count">0/4</span></h2>
      <div id="comparison-grid" class="comparison-grid"></div>
    </section>
    <section class="panel review-form">
      <h2>レビューを書き出す</h2>
      <p><strong>transport_smoke_output</strong> は通信・保存経路の証拠のみです。<strong>creative_candidate</strong> は所有者による明示的な創作レビュー結果です。</p>
      <label>対象候補 <select id="review-candidate"></select></label>
      <label>レビュー範囲 <select id="review-scope"></select></label>
      <label>判定 <select id="decision"></select></label>
      <label>レビュアー <input id="reviewer" required autocomplete="off"></label>
      <p>結果品質段階: <output id="resulting-quality-stage">—</output></p>
      <fieldset><legend>通常の指摘カテゴリ</legend><div id="category-list" class="category-list"></div></fieldset>
      <fieldset><legend>ハード失敗カテゴリ</legend><div id="hard-fail-list" class="category-list"></div></fieldset>
      <label>メモ <textarea id="notes" rows="4"></textarea></label>
      <button id="download-review" type="button">レビューJSONをダウンロード</button>
      <pre id="review-preview" aria-live="polite"></pre>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
