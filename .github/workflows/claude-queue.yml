name: Claude Issue Queue
run-name: Claude Issue Queue issue-${{ inputs.issue_number || github.event.issue.number || 'event' }} request-${{ inputs.request_fingerprint || 'event' }} attempt-${{ inputs.recovery_attempt || '0' }}

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Trusted Issue number
        required: true
        type: string
      trusted_supervisor:
        description: True only for a fixed default-branch recovery dispatch
        required: false
        default: false
        type: boolean
      trusted_run_id:
        description: Trusted reconciliation workflow run ID when dispatched by github-actions[bot]
        required: false
        default: ""
        type: string
      request_fingerprint:
        description: Exact Queue request fingerprint for supervisor recovery
        required: false
        default: ""
        type: string
      recovery_attempt:
        description: Positive bounded recovery attempt number
        required: false
        default: ""
        type: string

concurrency:
  group: claude-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: |
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER)
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER) ||
          github.actor == 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issue_number: ${{ steps.guard.outputs.issue_number }}
      should_run: ${{ steps.guard.outputs.should_run }}
      duplicate_skipped: ${{ steps.guard.outputs.duplicate_skipped }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          TRUSTED_SUPERVISOR: ${{ inputs.trusted_supervisor }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
          REQUEST_FINGERPRINT: ${{ inputs.request_fingerprint }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_OWNER: ${{ vars.AUTOMATION_OWNER }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          configured_owner = os.environ.get("CONFIGURED_OWNER", "")
          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          trigger = "/claude-run"
          issue_number = ""
          allowed = False
          duplicate = False

          def api(path: str):
              return json.loads(
                  subprocess.check_output(
                      ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                      text=True,
                  )
              )

          if event_name == "issue_comment":
              issue = event.get("issue") or {}
              body = ((event.get("comment") or {}).get("body") or "")
              issue_number = str(issue.get("number") or "")
              allowed = not issue.get("pull_request") and body.strip() == trigger
          elif event_name == "issues":
              issue = event.get("issue") or {}
              issue_number = str(issue.get("number") or "")
              body = issue.get("body") or ""
              lines = [
                  line.strip()
                  for line in re.sub(r"<!--.*?-->", "", body, flags=re.S).splitlines()
                  if line.strip()
              ]
              allowed = bool(lines and lines[0] == trigger)
          elif event_name == "workflow_dispatch":
              issue_number = os.environ.get("DISPATCH_ISSUE", "")
              owner_dispatch = actor == owner or bool(configured_owner and actor == configured_owner)
              if owner_dispatch:
                  allowed = issue_number.isdigit()
              elif actor == "github-actions[bot]":
                  run_id = os.environ.get("TRUSTED_RUN_ID", "")
                  fingerprint = os.environ.get("REQUEST_FINGERPRINT", "")
                  attempt = os.environ.get("RECOVERY_ATTEMPT", "")
                  trusted = os.environ.get("TRUSTED_SUPERVISOR", "").lower() == "true"
                  exact_recovery = bool(
                      re.fullmatch(r"[0-9a-f]{20}", fingerprint)
                      and attempt.isdigit()
                      and int(attempt) > 0
                  )
                  if trusted and exact_recovery and issue_number.isdigit() and run_id.isdigit():
                      snapshot = api(f"repos/{repository}/actions/runs/{run_id}")
                      default_sha = api(f"repos/{repository}/commits/{default_branch}")["sha"]
                      expected_path = f".github/workflows/ci-reconcile.yml@{default_branch}"
                      allowed = (
                          (snapshot.get("repository") or {}).get("full_name") == repository
                          and snapshot.get("path") == expected_path
                          and snapshot.get("head_branch") == default_branch
                          and snapshot.get("head_sha") == default_sha
                          and snapshot.get("status") in {"queued", "in_progress"}
                          and snapshot.get("event") in {"workflow_run", "schedule", "workflow_dispatch"}
                      )

          if issue_number.isdigit() and allowed:
              issue_snapshot = api(f"repos/{repository}/issues/{issue_number}")
              issue_author = (issue_snapshot.get("user") or {}).get("login") or ""
              trusted_authors = {owner}
              if configured_owner:
                  trusted_authors.add(configured_owner)
              allowed = not issue_snapshot.get("pull_request") and issue_author in trusted_authors
          else:
              allowed = False

          if allowed:
              pulls = api(f"repos/{repository}/pulls?state=open&per_page=100")
              prefix = f"claude-issue-{issue_number}-"
              duplicate = any(
                  ((pull.get("head") or {}).get("ref") or "").startswith(prefix)
                  and (((pull.get("head") or {}).get("repo") or {}).get("full_name") == repository)
                  for pull in pulls
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_number={issue_number}\n")
              output.write(f"should_run={str(allowed).lower()}\n")
              output.write(f"duplicate_skipped={str(duplicate).lower()}\n")
          PY

      - name: Record duplicate skip
        if: steps.guard.outputs.should_run == 'true' && steps.guard.outputs.duplicate_skipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.guard.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- foundation-queue-duplicate:$ISSUE_NUMBER -->"
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body' | grep -Fq "$marker"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$marker
          A Claude Queue Pull Request is already open for this Issue. Duplicate execution was skipped.

          Queue run: $RUN_URL"
          fi

  implement:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.duplicate_skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    outputs:
      branch_name: ${{ steps.require_branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.repository.default_branch }}
          branch_prefix: claude-issue-${{ needs.prepare.outputs.issue_number }}-
          track_progress: true
          prompt: |
            Implement Issue #${{ needs.prepare.outputs.issue_number }} exactly as written.
            Read AGENTS.md, CLAUDE.md, SECURITY.md, and docs/OPERATING_RULES.md.
            Change only authorized paths. Do not execute repository code, merge, deploy,
            access another repository, reveal Secrets, or change repository settings.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
      - name: Require generated branch
        id: require_branch
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          test -n "$BRANCH"
          case "$BRANCH" in
            claude-issue-${{ needs.prepare.outputs.issue_number }}-*) ;;
            *) echo "Unexpected Queue branch: $BRANCH" >&2; exit 1 ;;
          esac
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

  resolve:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch_sha: ${{ steps.resolve.outputs.branch_sha }}
    steps:
      - name: Resolve generated branch to one immutable SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.implement.outputs.branch_name }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          printf '%s' "$branch_sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "branch_sha=$branch_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ needs.resolve.outputs.branch_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify immutable checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests

  publish:
    needs: [prepare, implement, resolve, verify]
    if: |
      needs.prepare.outputs.should_run == 'true' &&
      needs.prepare.outputs.duplicate_skipped != 'true' &&
      needs.implement.result == 'success' &&
      needs.resolve.result == 'success' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - name: Publish one immutable Draft Pull Request without executing branch code
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BRANCH: ${{ needs.implement.outputs.branch_name }}
          TARGET_SHA: ${{ needs.resolve.outputs.branch_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          test "$current_sha" = "$TARGET_SHA"

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            pr_url="$existing"
          else
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$TARGET_SHA" --jq '.files[].filename' | sed 's/^/- `/' | sed 's/$/`/')
            test -n "$changed"
            cat > "$RUNNER_TEMP/queue-pr.md" <<EOF
          Closes #$ISSUE_NUMBER.

          ## Exact changed paths

          $changed

          ## Immutable Queue verification

          - verified head SHA: \`$TARGET_SHA\`
          - \`python scripts/public_export_guard.py .\`
          - \`python scripts/validate_repository.py\`
          - \`python -m unittest discover -s tests\`
          - verification ran in a separate \`contents: read\` job with persisted credentials disabled

          ## Security boundaries

          - proposed-branch code did not execute in this publication job
          - no merge or deployment was performed
          - native Pull Request checks, trusted exact-SHA attestations, Codex review, and the supervisor remain required
          EOF
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "Claude: Issue #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/queue-pr.md")
          fi

          snapshot=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv')
          IFS=$'\t' read -r pr_sha pr_state pr_draft <<< "$snapshot"
          test "$pr_sha" = "$TARGET_SHA"
          test "$pr_state" = "OPEN"
          test "$pr_draft" = "true"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

  finalize:
    needs: [prepare, implement, resolve, verify, publish]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      DUPLICATE_SKIPPED: ${{ needs.prepare.outputs.duplicate_skipped }}
      IMPLEMENT_RESULT: ${{ needs.implement.result }}
      RESOLVE_RESULT: ${{ needs.resolve.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      TARGET_SHA: ${{ needs.resolve.outputs.branch_sha }}
    steps:
      - name: Publish successful Queue state or retain non-notifying failure evidence
        run: |
          set -euo pipefail
          gh label create ai-review --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Automation candidate awaits exact-SHA evidence" --force

          if [ "$DUPLICATE_SKIPPED" = "true" ]; then
            exit 0
          fi

          if [ "$IMPLEMENT_RESULT" = success ] && [ "$RESOLVE_RESULT" = success ] && [ "$VERIFY_RESULT" = success ] && [ "$PUBLISH_RESULT" = success ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ai-review --remove-label ai-blocked || true
            exit 0
          fi

          {
            echo "## Queue pipeline incomplete"
            echo
            echo "- issue: #$ISSUE_NUMBER"
            echo "- immutable_sha: ${TARGET_SHA:-unavailable}"
            echo "- stages: implement=$IMPLEMENT_RESULT resolve=$RESOLVE_RESULT verify=$VERIFY_RESULT publish=$PUBLISH_RESULT"
            echo "- notification: false"
            echo "- next: merged default-branch reconciliation performs the bounded self-resolution audit and internal-stop decision"
          } >> "$GITHUB_STEP_SUMMARY"
