name: Claude Queue Comment Bridge

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-queue-comment-bridge-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  forward:
    if: >-
      github.actor == github.repository_owner &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/claude-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted Queue workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run claude-queue.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f issue_number="$ISSUE_NUMBER"
