[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-illustration-manifests"
version = "0.1.0"
description = "Local manifest validation core for the manzai character illustration pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-illustration-manifest = "ai_illustration.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
